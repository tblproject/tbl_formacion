version: 2

models:
  - name: stg_customers
    description: "Clientes normalizados (una fila por cliente)."
    columns:
      - name: customer_id
        description: "Clave primaria del cliente."
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null

  - name: stg_products
    description: "Catalogo de productos con precio en euros."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              values: ['comida', 'bebida', 'postre']

  - name: stg_orders
    description: "Pedidos normalizados (una fila por pedido)."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        description: "FK al cliente."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'returned']

  - name: stg_order_items
    description: "Lineas de pedido."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('stg_products')
              field: product_id

  - name: stg_payments
    description: "Pagos normalizados."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payment_method
        data_tests:
          - accepted_values:
              values: ['credit_card', 'paypal', 'bank_transfer', 'gift_card']
