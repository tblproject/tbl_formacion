version: 2

models:
  - name: int_order_items_priced
    description: "Lineas de pedido enriquecidas con producto y precio."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: line_amount_eur
        data_tests:
          - non_negative

  - name: int_orders_aggregated
    description: "Totales por pedido."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
