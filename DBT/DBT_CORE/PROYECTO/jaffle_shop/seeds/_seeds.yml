version: 2

seeds:
  - name: raw_customers
    description: "Datos crudos de clientes (fichero CSV cargado con dbt seed)."
  - name: raw_products
    description: "Catalogo de productos crudo."
  - name: raw_orders
    description: "Pedidos crudos."
  - name: raw_order_items
    description: "Lineas de pedido crudas."
  - name: raw_payments
    description: "Pagos crudos."
  - name: seed_status_map
    description: >
      Tabla de referencia (datos estaticos) que traduce el codigo de estado de
      un pedido a una descripcion legible e indica si es un estado final.
      Ejemplo del uso tipico de un seed: datos pequenos y estables mantenidos
      junto al codigo y referenciados con ref().
    columns:
      - name: order_status
        data_tests: [unique, not_null]
