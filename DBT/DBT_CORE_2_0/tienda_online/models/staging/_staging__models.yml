version: 2

models:
  - name: stg_customers
    description: Clientes normalizados (un registro por cliente).
    columns:
      - name: customer_id
        description: Clave primaria del cliente.
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - unique
      - name: country
        data_tests:
          - accepted_values:
              values: ['ES', 'PT', 'MX', 'AR', 'CO']

  - name: stg_products
    description: Catálogo de productos normalizado, con precio en euros.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: unit_price_eur
        data_tests:
          - not_null

  - name: stg_orders
    description: Pedidos normalizados.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'shipped', 'returned', 'cancelled']

  - name: stg_order_items
    description: Líneas de pedido normalizadas.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        data_tests:
          - not_null
